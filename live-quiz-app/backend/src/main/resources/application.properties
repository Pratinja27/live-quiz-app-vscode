# ============================================================
# Live Quiz Application - Spring Boot Configuration
# ============================================================

# Server Configuration
server.port=8080

# ============================================================
# MySQL Database Configuration
# ============================================================
# Update these values to match your local MySQL setup
spring.datasource.url=jdbc:mysql://localhost:3306/live_quiz_db
spring.datasource.username=root
spring.datasource.password=Pratinja@1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# Hibernate / JPA Configuration
# ============================================================
# hibernate.ddl-auto options:
#   create       - drops and re-creates schema every restart (use for dev)
#   update       - updates schema without dropping data (use for staging)
#   validate     - validates schema exists but makes no changes (use for prod)
#   create-drop  - creates on start, drops on shutdown
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in console (set to false in production)
spring.jpa.show-sql=true

# Format SQL for readability
spring.jpa.properties.hibernate.format_sql=true

# MySQL dialect for Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
# ============================================================
# Application Name
# ============================================================
spring.application.name=live-quiz-backend

# ============================================================
# Logging
# ============================================================
logging.level.com.livequiz=DEBUG
logging.level.org.springframework.web=INFO
